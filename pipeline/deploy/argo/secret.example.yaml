# Template — DO NOT COMMIT a populated copy of this file.
#
# Create the real secret out-of-band, e.g.:
#
#   kubectl create secret generic poke-pipeline \
#     --from-literal=DATABASE_URL="postgres://user:pass@host:5432/db?sslmode=require" \
#     --from-literal=OPENAI_API_KEY="sk-…"
#
# Or use sealed-secrets / external-secrets / SOPS — whatever your cluster uses
# for secret management. The WorkflowTemplate references `name: poke-pipeline`
# with keys `DATABASE_URL` (required), `OPENAI_API_KEY` (required only for
# the insights phase) and `ALERT_WEBHOOK_URL` (optional; where the watchlist
# and mention alerts are posted — Slack, Discord or any JSON webhook).
# `APP_URL` and `CRON_TOKEN` (both optional) are only for the refresh-prices
# phase: where the web app is, and the same CRON_TOKEN the app was started with
# (generate one with `openssl rand -hex 32`).
apiVersion: v1
kind: Secret
metadata:
  name: poke-pipeline
type: Opaque
stringData:
  DATABASE_URL: "postgres://USER:PASSWORD@HOST:5432/DB?sslmode=require"
  OPENAI_API_KEY: "sk-REPLACE-ME"
  # Optional. Omit the key entirely to disable alert delivery.
  ALERT_WEBHOOK_URL: "https://discord.com/api/webhooks/REPLACE-ME"
  # Optional; only for the refresh-prices phase. The URL must be reachable from
  # the cluster, and if the app has no login, its host name must be allowed there
  # (APP_ALLOWED_HOSTS on the app).
  APP_URL: "http://poke-investor.default.svc.cluster.local:3000"
  CRON_TOKEN: "REPLACE-ME-with-at-least-32-random-characters"
